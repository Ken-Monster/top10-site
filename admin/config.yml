# Decap CMS Configuration File


# The backend option specifies how to access the content for your site
backend:
  name: github
  repo: Ken-Monster/top10-site
  branch: main
  site_domain: https://top10.cc.cd
  base_url: https://top10.cc.cd
  auth_endpoint: /api/auth

locale: "zh_Hans"

# Uncomment below to enable drafts https://www.decapcms.org/docs/add-to-your-site/#editorial-workflow
# publish_mode: editorial_workflow

site_url: https://top10.cc.cd

media_folder: "static/img" # Media files will be stored in the repo under images/uploads

collections:
  # Our blog posts
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "文章" # Used in the UI
    label_singular: "文章"
    folder: "posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "作者", name: "author", widget: "string", default: "Anonymous" }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "标签", name: "tags", widget: "list", default: ["post"] }
      - { label: "正文", name: "body", widget: "markdown" }
  # Our pages e.g. About
  - name: "pages"
    label: "页面"
    label_singular: "页面"
    folder: "pages"
    create: false # Change to true to allow editors to create new pages
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "固定链接", name: "permalink", widget: "string" }
      - label: "导航" # https://www.11ty.dev/docs/plugins/navigation/
        name: "eleventyNavigation"
        widget: "object"
        fields:
          - { label: "名称", name: "key", widget: "string" }
          - { label: "排序", name: "order", widget: "number", default: 0 }
      - { label: "正文", name: "body", widget: "markdown" }
